services:
  codex-usage-monitor:
    image: ghcr.io/danhk0612/codex-usage-monitor:${IMAGE_TAG:-latest}
    container_name: codex-usage-monitor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-1800}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CODEX_HOME: /root/.codex
    volumes:
      - ./codex-data:/root/.codex
      - ./data:/app/data
